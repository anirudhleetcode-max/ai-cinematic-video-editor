# Optional. Local development does not need Docker (see README).
services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["8000:8000"]
    volumes: ["editor-data:/data"]
    environment:
      - EDITOR_CORS_ORIGINS=http://localhost:3000
      - EDITOR_ENV=development
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # For NVIDIA NVENC, uncomment (requires nvidia-container-toolkit and an ffmpeg build with nvenc):
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  editor-data:
