name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/engine/pyproject.toml }
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install
        run: pip install -e "services/engine[dev,vad]" ruff
      - name: Lint
        run: ruff check --select E9,F63,F7,F82,F401 services/engine/editor scripts
      - name: Optional models
        run: python scripts/download_models.py --dest "$RUNNER_TEMP/models" || echo "models unavailable - fallback paths are tested"
      - name: Tests
        working-directory: services/engine
        env: { EDITOR_MODELS_DIR: "${{ runner.temp }}/models" }
        run: python -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build api / worker / web images
        run: |
          docker build -f docker/engine.Dockerfile --target api -t cutroom-api .
          docker build -f docker/engine.Dockerfile --target worker -t cutroom-worker .
          docker build -f docker/web.Dockerfile -t cutroom-web .
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Smoke-test client dependencies (test media generator + ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && pip install -e services/engine
      - name: Container smoke test (api + worker + web containers, two users, generate, revise, download)
        run: bash scripts/container_smoke.sh
